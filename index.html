  <script>
    (function() {
      var ua = navigator.userAgent;
      var vendor = (navigator.vendor || '').toString();
      
      var isApple = (vendor.indexOf('Apple') !== -1)
        || /Macintosh|Mac OS X|iPhone|iPad|iPod/i.test(ua);

      var scFontUrl = 'https://emoji-fonts-1342939114.cos.ap-nanjing.myqcloud.com/ZanhuaSans-SC-Regular-Decrease.woff2';
      var latinFontUrl = 'https://154.201.81.86' + window.__BASE + '/res/fonts/ZanhuaSans-Latin-Regular.woff2';
      var emojiUrl = 'https://emoji-fonts-1342939114.cos.ap-nanjing.myqcloud.com/emoji.ttf';

      
      var fontUrl = isApple ? latinFontUrl : scFontUrl;

      var pre = document.createElement('link');
      pre.rel = 'preload';
      pre.as = 'font';
      pre.href = fontUrl;
      pre.crossOrigin = 'anonymous';
      document.head.appendChild(pre);

      var emojiRanges = [
        'U+1F600-1F64F',
        'U+1F300-1F5FF',
        'U+1F680-1F6FF',
        'U+1F900-1F9FF',
        'U+1FA00-1FA6F, U+1FA70-1FAFF',
        'U+2600-26FF, U+2700-27BF',
        'U+FE00-FE0F, U+1F000-1F0FF',
        'U+2300-23FF, U+2B00-2BFF, U+25A0-25FF, U+2764, U+2728, U+2B50, U+2190-21FF'
      ];

      var fontStyleEl = document.createElement('style');
      document.head.appendChild(fontStyleEl);

      function setFontFace(family, url, format, extraCss) {
        var css = "@font-face {" +
          "font-family:'" + family + "';" +
          "src:url('" + url + "') format('" + format + "');" +
          "font-display:swap;" +
          "font-weight:400;" +
          "font-style:normal;" +
          (extraCss || '') +
          "}";
        fontStyleEl.textContent = fontStyleEl.textContent.replace(
          new RegExp("@font-face \\{font-family:'" + family + "'[^}]*\\}", 'g'), ''
        );
        fontStyleEl.textContent = fontStyleEl.textContent + '\n' + css;
      }

      function setEmojiFontFace(url, format) {
        format = format || 'truetype';
        var css = emojiRanges.map(function(range) {
          return "@font-face {" +
            "font-family:'EmojiFont';" +
            "src:url('" + url + "') format('" + format + "');" +
            "font-display:block;" +
            "unicode-range:" + range + ";" +
            "}";
        }).join('\n');
        fontStyleEl.textContent = fontStyleEl.textContent.replace(
          /@font-face \{font-family:'EmojiFont'[^}]*\}\n?/g, ''
        );
        fontStyleEl.textContent = fontStyleEl.textContent + '\n' + css;
      }

      setFontFace('ZanhuaSans', fontUrl, 'woff2');
      if (!isApple) setEmojiFontFace(emojiUrl, 'truetype');

      function loadFont(href, family, format, timeout) {
        return new Promise(function(resolve) {
          var settled = false;
          var timer = setTimeout(function() {
            if (!settled) { settled = true; resolve(false); }
          }, timeout || 15000);

          function done(ok) {
            if (!settled) {
              settled = true;
              clearTimeout(timer);
              resolve(ok);
            }
          }

          try {
            var ff = new FontFace(family, 'url(' + href + ')', { crossOrigin: 'anonymous' });
            ff.load().then(function(loaded) {
              if (document.fonts) document.fonts.add(loaded);
              done(true);
            }).catch(function() {
              done(false);
            });
          } catch(e) {
            done(false);
          }
        });
      }

      loadFont(fontUrl, 'ZanhuaSans', 'woff2', 15000).then(function(ok) {
        if (!ok && !isApple) {
          setFontFace('ZanhuaSans', latinFontUrl, 'woff2');
          return loadFont(latinFontUrl, 'ZanhuaSans', 'woff2', 15000);
        }
      });

      if (!isApple) {
        loadFont(emojiUrl, 'EmojiFont', 'truetype', 30000).then(function(ok) {
          if (!ok) {
            
            setEmojiFontFace(latinFontUrl, 'woff2');
            loadFont(latinFontUrl, 'EmojiFont', 'woff2', 15000).catch(function(){});
          }
        });
      }
    })();
